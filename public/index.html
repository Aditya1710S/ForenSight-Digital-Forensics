<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ForenSight - Digital Forensics &amp; Evidence Integrity</title>
  <meta name="color-scheme" content="light dark">
  <script src="/js/theme-init.js"></script>
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d4ed8'/%3E%3Cpath d='M16 6l8 3v7c0 5-3.5 8-8 10-4.5-2-8-5-8-10V9z' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Primary">
      <div class="brand"><span class="brand-mark"><i data-lucide="shield-check"></i></span><span class="brand-text">Foren<b>Sight</b></span></div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot"><i data-lucide="lock"></i><span>Local trusted environment</span></div>
    </aside>
    <div class="scrim" id="scrim"></div>
    <div class="main-col">
      <header class="topbar">
        <button class="icon-btn" id="menuBtn" aria-label="Toggle navigation" aria-controls="sidebar"><i data-lucide="menu"></i></button>
        <div class="search" role="search">
          <i data-lucide="search"></i>
          <input id="globalSearch" type="search" placeholder="Search cases, evidence, hashes..." aria-label="Global search" autocomplete="off">
          <div class="search-results" id="searchResults" hidden></div>
        </div>
        <div class="top-actions">
          <div class="menu-wrap">
            <button class="icon-btn" id="bellBtn" aria-label="Notifications" aria-expanded="false"><i data-lucide="bell"></i><span class="dot" id="bellDot" hidden></span></button>
            <div class="dropdown" id="bellMenu" hidden></div>
          </div>
          <button class="icon-btn" id="themeBtn" aria-label="Toggle theme"><i data-lucide="sun" class="icon-sun"></i><i data-lucide="moon" class="icon-moon"></i></button>
          <div class="menu-wrap">
            <button class="profile" id="profileBtn" aria-label="Profile" aria-expanded="false"><span class="avatar" id="avatar">?</span><span class="profile-name" id="profileName">Investigator</span></button>
            <div class="dropdown" id="profileMenu" hidden></div>
          </div>
        </div>
      </header>
      <div class="crumbs" id="crumbs" aria-label="Breadcrumb"></div>
      <main id="main" tabindex="-1"></main>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <dialog id="modal"></dialog>
<script src="/vendor/lucide.min.js" defer></script>
<script src="/vendor/chart.umd.js"></script>
<script type="module" src="/js/app.js"></script>
</html>
